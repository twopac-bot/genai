services:
  - type: web
    name: druginfo-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./druginfo.db
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-lite
      - key: MEMENTO_ENABLED
        value: "false"
      - key: GEMINI_API_KEY
        sync: false          # you will paste this in the Render dashboard
      - key: FIRECRAWL_API_KEY
        sync: false          # optional — leave blank to stay in mock mode
    healthCheckPath: /api/health
    autoDeploy: true
